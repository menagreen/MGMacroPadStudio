[package]
name = "macropad-studio"
version = "1.0.0"
edition = "2021"
authors = ["MenaGreen"]
description = "MacroPad Studio by MenaGreen — Windows USB HID Configurator & Daemon"
repository = "https://github.com/menagreen/MGMacroPadStudio"
license = "MIT"

[dependencies]
eframe = { version = "0.30", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
hidapi = "2.6"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_System_Registry"
] }

[build-dependencies]
winres = "0.1.12"
