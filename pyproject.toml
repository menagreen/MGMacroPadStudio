[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "macropad-studio"
version = "0.1.0"
description = "Configurador USB HID nativo para Windows (Macropad SDCX 6D80:DC81)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hidapi>=0.14.0",
    "PySide6>=6.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
]

[project.scripts]
macropad-studio = "app.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

